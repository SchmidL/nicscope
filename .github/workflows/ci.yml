name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: The headless mode must work with no third-party package
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install --quiet .
          /tmp/bare/bin/pip list --format=freeze | grep -vE '^(nicscope|pip|setuptools|wheel)=' > /tmp/extra.txt || true
          if [ -s /tmp/extra.txt ]; then
            echo "the headless install pulled in a dependency:"; cat /tmp/extra.txt; exit 1
          fi
          /tmp/bare/bin/nicscope --replay tests/fixtures/synthetic.capture.json --json > /tmp/out.json
          /tmp/bare/bin/nicscope --replay tests/fixtures/synthetic.capture.json --format md > /dev/null
          python -c "import json,sys; d=json.load(open('/tmp/out.json')); assert d['schema']=='nicscope/1'; assert len(d['interfaces'])==4"

      - name: The fixture must match its generator
        run: |
          python tests/fixtures/build_synthetic.py
          git diff --exit-code tests/fixtures/synthetic.capture.json

  live:
    # A best-effort run against whatever NIC the runner has. It must not fail
    # the build: a hosted runner has a virtual NIC with no PHC and no PTM.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Collect from the runner itself
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ethtool pciutils
          nicscope --json --include-virtual | head -c 4000
          nicscope --check || true
